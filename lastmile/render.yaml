services:
  # The Node.js Web API
  - type: web
    name: lastmile-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --force-reset && npx prisma db seed
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: lastmile-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lastmile-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # Redis Instance
  - type: redis
    name: lastmile-redis
    plan: free
    ipAllowList: [] # internal connections only

databases:
  # Managed PostgreSQL Database
  - name: lastmile-db
    databaseName: lastmile
    user: lastmile_user
    plan: free
